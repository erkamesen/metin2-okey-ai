# Metin2 Okey - oyun kurallari (motor bu dosyadan beslenir)
#
# OYUN AKISI (motorun varsaydigi):
#   - Elinde hand_size kadar acik kart var.
#   - Onunde TEK BIR uclu alan var. Kart ancak oraya konur.
#   - Uclu dolunca puanlanir, kilitlenir, yeni bos uclu acilir.
#   - Kart atilirsa kalici olarak gider; yerine desteden yeni kart gelir.
#   - Deste bitince tur biter.
#
# DOGRULANMASI GEREKEN: deck.colors. Su an 3 renk varsayildi (8 sayi x 3 renk
# = 24 kart). Oyunda 4. bir renk varsa buraya ekle; slots kendini gunceller.

deck:
  ranks: [1, 2, 3, 4, 5, 6, 7, 8]      # kart sayilari
  colors: [red, blue, green]           # kart renkleri
  copies: 1                            # her (renk, sayi) kombinasyonundan kac adet
  # toplam deste = len(ranks) * len(colors) * copies = 24

board:
  slots: auto         # kac kombinasyon kurulabilecegi = deste / combo_size
                      # (alanlar SIRAYLA acilir: acik uclu dolmadan digerine gecilmez)
  combo_size: 3       # bir kombinasyon kac karttan olusur
  hand_size: 5        # ayni anda acik duran kart sayisi

scoring:
  # Grup: ayni sayidan 3 kart (1-1-1 ... 8-8-8)
  group:
    1: 20
    2: 30
    3: 40
    4: 50
    5: 60
    6: 70
    7: 80
    8: 90
  # Seri: ardisik 3 sayi. Anahtar = serinin en kucuk sayisi.
  run_mixed:          # en az bir kart farkli renkte
    1: 10
    2: 20
    3: 30
    4: 40
    5: 50
    6: 60
  run_same_color:     # ucu de ayni renk
    1: 50
    2: 60
    3: 70
    4: 80
    5: 90
    6: 100
  invalid: 0          # gecerli kombinasyon olusmazsa

rewards:
  # Tur sonu sandigi (alt sinir -> odul). Buyukten kucuge kontrol edilir.
  - min_score: 400
    chest: golden
    label: "Altin Okey Sandigi"
  - min_score: 300
    chest: silver
    label: "Gumus Okey Sandigi"
  - min_score: 0
    chest: bronze
    label: "Bronz Okey Sandigi"

cost:
  yang: 30000
  card_set: 1

agent:
  provider: ollama
  host: "http://127.0.0.1:11434"
  model: "qwen3.5:9b"
  timeout_s: 180
  temperature: 0.2
  max_retries: 2
  num_predict: 200           # cevap uzunlugu siniri (kisa tut = hizli)
  think: false               # qwen3.x dusunme zinciri hamle basina dakikalar suruyor
  with_hints: true           # her alani neyin tamamladigini prompt icinde goster
  fallback_to_solver: true   # gecersiz/timeout durumunda solver devralir
  solver_rollouts: 12        # oneri/veto solveri icin Monte-Carlo dogrulama
                             # (0 = kapali, saf sezgisel). Olcum: 225 -> 307 puan
  veto_margin: 0.25          # modelin onerisi solver siralamasinin bu kadar altindaysa
                             # reddedilir (0 = veto kapali)
  deep_rollouts: 40          # "Derin Analiz" dugmesi: daha fazla simulasyon,
                             # dolayisiyla daha dusuk gurultu. TUM adaylar denenir:
                             # az aday + cok simulasyon, cok aday + az simulasyondan kotu.
  deep_candidates: 0         # 0 = butun adaylari dene (on eleme yok)

logging:
  stages_csv: "logs/stages.csv"
  games_csv: "logs/games.csv"
